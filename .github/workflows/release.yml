name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          GOOS=linux  GOARCH=amd64 go build -ldflags="-s -w" -o minedns-linux-amd64  .
          GOOS=linux  GOARCH=arm64 go build -ldflags="-s -w" -o minedns-linux-arm64  .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o minedns-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o minedns-darwin-arm64 .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            minedns-linux-amd64
            minedns-linux-arm64
            minedns-darwin-amd64
            minedns-darwin-arm64
